name: Build EveryFormula APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-app
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish APK file
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/EveryFormula-v1.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/EveryFormula-v1.0-debug.apk
          git commit -m "Publish EveryFormula debug APK"
          git push

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EveryFormula-v1.0-debug
          path: dist/EveryFormula-v1.0-debug.apk
          if-no-files-found: error
