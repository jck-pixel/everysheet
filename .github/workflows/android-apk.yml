name: Verify EveryFormula Android APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
jobs:
  verify-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: everyformula-debug-keystore-v1
      - run: npm ci
      - name: Sync Android
        run: npm run android:sync
        env:
          CAPACITOR_SERVER_URL: https://everyformula.vercel.app
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Save signing key
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: everyformula-debug-keystore-v1
      - name: Verify install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb wait-for-device
            for attempt in 1 2 3 4 5 6; do
              adb shell service check package | grep -q found && break
              sleep 5
            done
            adb shell service check package | grep -q found
            adb logcat -c
            installed=false
            for attempt in 1 2 3 4 5; do
              if adb install -r android/app/build/outputs/apk/debug/app-debug.apk; then
                installed=true
                break
              fi
              adb reconnect
              adb wait-for-device
              sleep 8
            done
            test "$installed" = true
            adb shell am start -W -n com.everyformula.app/.MainActivity | tee android-launch-result.txt
            sleep 12
            adb shell pidof com.everyformula.app | tee android-process-id.txt
            test -s android-process-id.txt
            adb shell dumpsys activity activities | grep -q "com.everyformula.app/.MainActivity"
            adb logcat -d -t 1000 > android-launch-log.txt
            if grep -A12 "FATAL EXCEPTION" android-launch-log.txt | grep -q "Process: com.everyformula.app"; then exit 1; fi
            adb exec-out screencap -p > android-launch.png
      - name: Prepare APK
        run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/EveryFormula-v2.0-debug.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: EveryFormula-v2.0-verified
          path: dist/EveryFormula-v2.0-debug.apk
          if-no-files-found: error
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: EveryFormula-v2.0-launch-evidence
          path: |
            android-launch-result.txt
            android-process-id.txt
            android-launch-log.txt
            android-launch.png
          if-no-files-found: error
